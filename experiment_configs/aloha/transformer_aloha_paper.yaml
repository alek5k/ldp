# Paper-reproduction long-context PTP stage. The paper specifies 32 observed
# frames sampled every 20 frames for Long-Horizon ALOHA.
defaults:
  - transformer_aloha_emb
  - _self_

global_horizon: 48
global_obs: 32
global_action: 8
subsample_frames: 20
subsampling_method: uniform

policy:
  past_action_pred: true
  # Default to raw observations. Cached vectors can be stale or produced with
  # different preprocessing from rollout, making training and evaluation diverge.
  use_embed_if_present: false

task:
  dataset:
    use_embed_if_present: false

training:
  num_epochs: 1500
