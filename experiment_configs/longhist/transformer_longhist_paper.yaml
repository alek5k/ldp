# Paper-reproduction long-context PTP stage. The paper specifies 20 observed
# frames sampled every 20 frames for Long-Horizon Square.
defaults:
  - transformer_longhist_emb
  - _self_

global_horizon: 32
global_obs: 20
global_action: 8
subsample_frames: 20
task:
  dataset:
    dataset_path: data/longhistsquare100/demos.hdf5
    # Default to raw observations. Cached vectors can be stale or produced
    # with different preprocessing from rollout, making the two diverge.
    use_embed_if_present: false
  dataset_path: data/longhistsquare100/demos.hdf5
  env_runner:
    dataset_path: data/longhistsquare100/demos.hdf5

policy:
  use_embed_if_present: false

training:
  num_epochs: 500
